
<!DOCTYPE html>

<html>

  <head>
    <meta charset="UTF-8">
    <title>Canvas</title>

    <style type="text/css">
      body {
          background-color: white;
      }

      canvas {
        border: black;
        border-style: solid;
        }

    </style>

  </head>

  <body>
    <h1>Trin</h1>
    <canvas id="canvas-for-ball" width = "300" height = "200"></canvas>

    <script type="text/javascript">
      // Gets a handle to the element with id canvasOne.
      var canvas = document.getElementById("canvas-for-ball");
      // Get a 2D context for the canvas.
      var ctx = canvas.getContext("2d");


      class Ball{

        constructor(yPosition, ySpeed, xPosition, xSpeed){
            this.yPosition = yPosition;
            this. ySpeed = ySpeed
            this.xPosition = xPosition;
            this. xSpeed = xSpeed
        }

        draw(){
            // Draw the ball (stroked, not filled).
         ctx.beginPath();
        ctx.arc(50, this.yPosition, 3, 0, 2 * Math.PI);
        ctx.arc(50, this.xPosition, 80, 0, 2 * Math.PI);

        ctx.stroke();
        }

        move(){
            ///update y location
            this.yPosition += this.ySpeed;

              // If the ball hits the bottom of the canvas.
          if (this.yPosition == 197) {
            this.ySpeed = this.ySpeed * -1;
          } 

          if (this.yPosition == 3) {//when ball hits bottom to make it go back up
            this.ySpeed = this.ySpeed * -1;
          }

        }
      }

      myBall = new Ball(10, 1)

      // A function to repeat every time the animation loops.
      function repeatme() {

       ctx.clearRect(0, 0, 300, 200);

         
        myBall.draw();
        myBall.move(); 

         
        window.requestAnimationFrame(repeatme); 
      }
      
      // Get the animation going.
      repeatme();
    </script>

  </body>

</html>
