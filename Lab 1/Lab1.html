<!DOCTYPE html>

<html>

  <head>
    <meta charset="UTF-8">
    <title>Canvas</title>

    <style type="text/css">
        canvas {
        border: black;
        border-style: solid;
        }
    </style>

  </head>

  <body>

    <canvas id="canvasOne" width="500" height="500"></canvas>

    <script type="text/javascript">
		
        const canvas = document.getElementById("canvasOne");
        // Gets a handle to the element with id canvasOne.
		
        const ctx = canvas.getContext("2d");
        // Set the canvas up for drawing in 2D.

		// Set the fill colour to bright red.
        ctx.fillStyle = "rgb(0, 255, 0)";
        ctx.fillRect(10, 10, 250, 150);//filled rectangle

        ctx.fillStyle = "rgb(0, 0, 0)";
        ctx.font = "50px Arial";
        ctx.fillText("Trin",10,80);
       
        ctx.fillStyle = "rgba(255, 0, 0, 0.5)";//transparent rectangle
	    	ctx.fillRect(120, 120, 250, 150);//filled rectangle

        //add circle 1
        ctx.beginPath();
        ctx.arc(95,340,40,0,2 * Math.PI);
        ctx.fillStyle  = "rgb(255, 0, 0)";
        ctx.fill();
        ctx.strokeStyle = "rgb(0, 0, 225)";
        ctx.lineWidth = 3;
        ctx.stroke();

        //add circle 2
        ctx.beginPath();
        ctx.arc(250,340,40,0,2 * Math.PI);
        ctx.fillStyle  = "rgb(255, 0, 0)";
        ctx.fill();
        ctx.strokeStyle = "rgb(0, 0, 225)";
        ctx.lineWidth = 3;
        ctx.stroke();

        //add semi circle
        ctx.beginPath();
        ctx.arc(250, 430, 50, 0, Math.PI);
        ctx.fill();
        ctx.strokeStyle = "rgb(0, 0, 225)";
        ctx.lineWidth = 3;
        ctx.stroke();

        //add 3/4 circle
        ctx.beginPath();
        ctx.arc(440, 360, 50, 0, 0.5 * Math.PI, true);

        ctx.lineWidth = 3;
        ctx.strokeStyle = "rgb(0, 193, 207)";

        //create lines to close partial circle
        ctx.lineTo(440, 360);
        ctx.lineTo(450, 360);

        ctx.fillStyle = "rgb(97, 240, 250)";
        ctx.fill();

        ctx.stroke();
        

	
    </script>

  </body>

</html>
