<!DOCTYPE html>
<html>
    <h1>Trin</h1>
 <head>
 <title>D3.js Demo</title>
 <meta charset="UTF-8">
 <style type="text/css"></style>
 </head>
 <body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.1.0.min.js"></script>

    <script>
        //JSON call to api data
        $.getJSON("https://tinyurl.com/k4chnujx", function (data){

            //print to console
            console.log(data);
            data = data.slice(0, 2500);
            
            //call function
            plotCO2Data(data);
        });

        //Executed once the file has downloaded
        function plotCO2Data(data){

            //Set up SVG size and margins
            var margin = { top: 50, right: 50, bottom: 50, left: 50 },
            width = 900 - margin.left - margin.right,
            height = 670 - margin.top - margin.bottom;

            var x = d3.scaleLinear()
                .domain(d3.extent(data, function (d) { return (d["years_before_2023"]); }))//CO2 values
                .range([0,width]);
            

            var y = d3.scaleLinear()
                .domain(d3.extent(data, function (d) { return d["co2_ppmv"]; }))
                .range([height, 0]);

            var valueLine = d3.line() //drawing line -map x, y coors for each data point using the scales
                .x(function(d){return x(d["years_before_2023"])})
                .y(function(d){return y(d["co2_ppmv"])});

            //Axes
            var xAxis = d3.axisBottom(x)
                .ticks(3);//specifying number of ticks

            var yAxis = d3.axisLeft(y)
                .ticks(3);//specifying number of ticks

            var svg = d3.select('body')
                .append("svg")
                    .attr("width", width + margin.left + margin.right)
                    .attr("height", height + margin.top + margin.bottom)

                .append("g")

                    //adds offset so numeric values are visible
                    .attr("transform", "translate(" + margin.left + "," + margin.top + ")");

            svg.append('g')//append a <g> - group element
                .attr('class', 'x axis')
                .attr("transform", "translate(0," + height + ")")//moving x axis to bottom
                .call(xAxis); //letting axis do its things

                svg.append('g')
                .attr('class', 'y axis') //specifying classes
                .call(yAxis); //letting axis do its things

                svg.append("path") //adding the valueline path
                    .attr("d", valueLine(data));
        }

    </script>
    </body>
</body>
</html>
