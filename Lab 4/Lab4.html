<!DOCTYPE html>

<html>

<head>
  <meta charset="UTF-8">
  <title>Canvas</title>

  <style type="text/css">
    body {
      background-color: white;
    }

    canvas {
      display: block;
      border: black;
      border-style: solid;
    }

    #score1 {
      margin-top: 10px;
      font-size: 20px;
      color: black;
    }

    #score2 {
      margin-top: 10px;
      font-size: 20px;
      color: black;
    }
  </style>

</head>

<body>
  <h1>Trin</h1>
  <canvas id="canvas-for-ball" width="300" height="200"></canvas>
  <div id="score1">Score 1: 0</div> <!--Score element-->
  <div id="score2">Score 2: 0</div> <!--Score element-->
  <div id="collision"></div> <!--Collision element-->

  <script type="text/javascript">
    // Gets a handle to the element with id canvasOne.
    var canvas = document.getElementById("canvas-for-ball");

    // Get a 2D context for the canvas.
    var ctx = canvas.getContext("2d");

    const scoreElement = document.getElementById("score1");
    const scoreElement2 = document.getElementById("score2");
    const collisionElement = document.getElementById("collision");


    let score1 = 0; // Initializing the score variable
    let score2 = 0; // Initializing the score variable

    var canvasPosition = //declaring canvas position
    {
      x: canvas.offsetLeft,
      y: canvas.offsetTop
    };


    var noClicks = 0;

    class Paddle {
        constructor (xPosition, yPosition, ySpeed, xSpeed, radius)
        {
          this.xPosition = xPosition;
          this.yPosition = yPosition;
          this.xSpeed = xSpeed;
          this.ySpeed = ySpeed;
          this.radius = radius;
        }


      draw() {

       // Draw the ball (stroked, not filled).
       ctx.fillStyle = "rgb(0, 0, 0)";
        ctx.beginPath();
        ctx.arc(this.xPosition, this.yPosition, this.radius, 0, 2 * Math.PI);
        ctx.fill();
        ctx.strokeStyle = "black";
        ctx.stroke();

      }

      move() {

        this.yPosition = yPosition;
        this.xPosition = xPosition;

        if (yPosition > canvas.height) {
          yPosition = canvas.height;
        }
      }

    }

  
    class Ball {

      constructor(yPosition, ySpeed, xPosition, xSpeed, radius) {
        this.yPosition = yPosition;
        this.ySpeed = ySpeed;
        this.xPosition = xPosition;
        this.xSpeed = xSpeed;
        this.rotation = 0;//initializing rotation
        this.rotationSpeed = 0.05;//initializing rotation speed
        this.radius = radius;
        this.height = canvas.height;
        this.width = canvas.width;
        this.gravity = 0.1;  //constant downward acceleration
        this.bounceDecrease = 0.9; //kinetic energy loss of 90%
      }

      draw() {
        // Draw the ball (stroked, not filled).
        ctx.fillStyle = "rgb(255, 0, 0)";
        ctx.beginPath();
        ctx.arc(this.xPosition, this.yPosition, this.radius, 0, 2 * Math.PI);
        ctx.fill();
        ctx.strokeStyle = "black";
        ctx.lineWidth=2;
        ctx.stroke();

        //rotation position   //rotation speed   
        this.rotation += this.rotationSpeed;

        //calculating end point of middle line
        var x1 = 15 * Math.cos((Math.PI / 2) + this.rotation) + this.xPosition;
        var y1 = 15 * Math.sin((Math.PI / 2) + this.rotation) + this.yPosition;

        //calculating end point of left line
        var x2 = 15 * Math.cos((3 * Math.PI / 4) + this.rotation) + this.xPosition;
        var y2 = 15 * Math.sin((3 * Math.PI / 4) + this.rotation) + this.yPosition;

        //calculating end point of right line
        var x3 = 15 * Math.cos((Math.PI / 4) + this.rotation) + this.xPosition;
        var y3 = 15 * Math.sin((Math.PI / 4) + this.rotation) + this.yPosition;

        //calculating end point of top middle line
        var x4 = -15 * Math.cos((Math.PI / 2) + this.rotation) + this.xPosition;
        var y4 = -15 * Math.sin((Math.PI / 2) + this.rotation) + this.yPosition;

        ctx.moveTo(this.xPosition, this.yPosition);//starting line from centre of ball
        ctx.lineTo(x1, y1);//drawing line to (x1, y1)

        ctx.moveTo(this.xPosition, this.yPosition);//starting line from centre of ball
        ctx.lineTo(x2, y2);//drawing line to (x2, y2)

        ctx.moveTo(this.xPosition, this.yPosition);//starting line from centre of ball
        ctx.lineTo(x3, y3);//drawing line to (x3, y3)

        ctx.moveTo(this.xPosition, this.yPosition);//starting line from centre of ball
        ctx.lineTo(x4, y4);//drawing line to (x4, y4)

        ctx.stroke();//completing drawing
      }

      move() {

        //update y location
        this.yPosition += this.ySpeed;
        ///update x location
        this.xPosition += this.xSpeed;

        if (this.yPosition >= this.height - this.radius) {// If the ball hits the bottom of the canvas.
          this.ySpeed = this.ySpeed * -1;//change direction

          this.yPosition = this.height - this.radius;  //adjusting position to stay within bounds
        }

        if (this.yPosition <= this.radius) {//if ball hits right side of canvas
          this.ySpeed = this.ySpeed * -1;//change direction
        }

        else if (this.xPosition >= this.width - this.radius) {//if ball hits left of canvas 
          this.xSpeed = this.xSpeed * -1;//change direction
        }

        else if (this.xPosition <= this.radius) {//if ball hits top of canvas
          this.xSpeed = this.xSpeed * -1;//change direction
        }

      }
    }

    function textWhenCollision(){//function to show text when collision occurs 
   
    collisionElement.textContent = `Collision`; 

      // Setting timeout to clear message after 750 milliseconds
      setTimeout(function () {
        document.getElementById("collision").innerText = '';
      }, 750);
    }
  

    let lastHitPaddle1 = false;//flag to track if paddle 1 was last hit
    let lastHitPaddle2 = false;//flag to track if paddle 2 was last hit

    function decrementScore(){// decrement score function

    if(lastHitPaddle1 && myBall.xPosition <= myBall.radius){
    // Decrement score if the ball hits wall behind it

      score1--;
      scoreElement.textContent = `Score 1: ${score1}`;
      lastHitPaddle1 = false; // reset after decrementing

    }

    if(myBall.xPosition >= canvas.width - myBall.radius && lastHitPaddle2){
    // Decrement score if the ball hits wall behind it

      score2--;
      scoreElement2.textContent = `Score 2: ${score2}`;
      lastHitPaddle2 = false; // reset after decrementing

    }
    }
    function checkCollision(ball, paddle, paddleNum){//function to check collision

    var dist = Math.sqrt(Math.pow(paddle.xPosition - ball.xPosition,2) + Math.pow(paddle.yPosition - ball.yPosition,2));

    if(dist < ball.radius + paddle.radius){//if collision is true
      //increment the score for paddle 1

      textWhenCollision();//displays message to screen

      ball.ySpeed = ball.ySpeed * -1;
      ball.xSpeed = myBall.xSpeed * -1;

      // Checking which paddle was hit and update scores
      if (paddleNum === 1) {
          score1++;
          scoreElement.textContent = `Score 1: ${score1}`; //Updating paddle 1 score
        lastHitPaddle1 = true; //set last hit to paddle 1
        lastHitPaddle2 = false; // reset paddle 2 flag
        }

      if (paddleNum === 2) {
          score2++;
          scoreElement2.textContent = `Score 2: ${score2}`; //Updating paddle 2 score
          lastHitPaddle2 = true;//set last hit to paddle 2
          lastHitPaddle1 = false; // reset paddle 1 flag
        }

      console.log("COLLISION")
    } 
    }

    myBall = new Ball(canvasPosition.y, 2, 50, 2, 15)
    myPaddle1 = new Paddle(20, 50, 1, 1, 15)
    myPaddle2 = new Paddle(280, 50, 1, 1, 15)

    var matchBalls=[]; //initializing empty array for match balls

    canvas.addEventListener("dblclick", function (event) {
      //figure out local mouse coords
      var mouse = {
        x: event.clientX - canvasPosition.x,
        y: event.clientY - canvasPosition.y
      }

      //creating a new ball at double click position
      var newBall = new Ball(mouse.y, 2, mouse.x, 2, 15);
       
      //adding the new ball to the matchBalls array
      matchBalls.push(newBall);

      console.log(matchBalls);
    });

    // A function to repeat every time the animation loops.
    function repeatme() {

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      myBall.draw();//calling draw
      myBall.move();//calling moves

          // creating match balls
      for (var i = 0; i < matchBalls.length; i++) {
        matchBalls[i].draw();
        matchBalls[i].move();
      }

      myPaddle1.draw();
      myPaddle2.draw();

      window.requestAnimationFrame(repeatme);

      checkCollision(myBall, myPaddle1, 1);
      checkCollision(myBall, myPaddle2, 2);

      decrementScore();
      
    }

    // Get the animation going.
    repeatme();

    canvas.addEventListener("click", function (event) {

      //figure out local mouse coords
      var mouse = {
        x: event.clientX - canvasPosition.x,
        y: event.clientY - canvasPosition.y
      }

      //checking if the click is on paddle 1
      if (mouse.x <= canvas.width / 2) {
        myPaddle1.yPosition = mouse.y; // updating paddle 1 position based on mouse click location 
      }

      //Ensuring paddle doesn't move beyond canvas bottom
      if (myPaddle1.yPosition + myPaddle1.height > canvas.height) {
        myPaddle1.yPosition = canvas.height - myPaddle1.height; // Limiting paddle 1
      }

      //checking if the click is on the right side (for Paddle 2)
      if (mouse.x > canvas.width / 2) {
        myPaddle2.yPosition = mouse.y; // updating paddle 2 position based on mouse click location
      }

      if (myPaddle2.yPosition + myPaddle2.height > canvas.height) {
        myPaddle2.yPosition = canvas.height - myPaddle2.height; // Limiting paddle 2
      }

      noClicks += 1;
      console.log(noClicks);
      console.log(event);
    });


    // Paddle control with keypresses
    document.body.addEventListener('keydown', function (e) {
      switch (e.keyCode) {

        //up arrow
        case 38:
          myPaddle1.yPosition -= 10;
          console.log("Paddle left moved up");
          if (myPaddle1.yPosition - myPaddle1.radius < 0) { // Ensuring paddle doesn't go above the canvas
          myPaddle1.yPosition = myPaddle1.radius;
          }
          break;

        //down arrow
        case 40:
          myPaddle1.yPosition += 10;
          console.log("Paddle left moved down");
          if (myPaddle1.yPosition + myPaddle1.radius > canvas.height) { // Ensuring paddle doesn't go below the canvas
            myPaddle1.yPosition = canvas.height - myPaddle1.radius;
          }
          break;

        //left arrow
        case 37:
          myPaddle2.yPosition -= 10;
          console.log("Paddle right moved up");
          if (myPaddle2.yPosition - myPaddle2.radius < 0) { // Ensuring paddle doesn't go above the canvas
          myPaddle2.yPosition = myPaddle2.radius;
          }
          break;

        //right arrow
        case 39:
          myPaddle2.yPosition += 10;
          console.log("Paddle right moved down");
          if (myPaddle2.yPosition + myPaddle2.radius > canvas.height) { // Ensuring paddle doesn't go below the canvas
            myPaddle2.yPosition = canvas.height - myPaddle2.radius;
          }
          break;

        //'A' key
        case 65:
          myBall.rotationSpeed += 0.02; // increase rotation speed of symbol
          console.log("Balls rotation speed has increased");
          break;

        //'S' key
        case 83:
          myBall.rotationSpeed -= 0.02; // decrease rotation speed iof symbol

          console.log("Balls rotation speed has decreased");
          break;

      }
    });

  </script>

</body>

</html>
