<!DOCTYPE html>
<html>
<!--Import Three.js CDN-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r127/three.min.js"></script>
<head>
    <meta charset="UTF-8">
    <title></title>
    <style type="text/css">
    </style>
</head>

<body>
    <h1>Trin</h1>
    <script type="text/javascript">

class Sphere {//Class for sphere
        
        constructor(scene, xPosition, yPosition, zPosition, ySpeed, xSpeed, zSpeed, radius, topBoundary, bottomBoundary, colour){//Constructor with parameters
            this.radius = radius;
            this.geometrySphere = new THREE.SphereGeometry( this.radius, 16, 8);
            this.materialSphere = new THREE.MeshLambertMaterial( { color: colour, wireframe: false } );
            this.wireframeMaterial = new THREE.MeshBasicMaterial({ color: 0x000000, wireframe: true }); // Wireframe color can be black or any other
            this.wireframe = new THREE.Mesh(this.geometrySphere, this.wireframeMaterial);
            this.xPosition = xPosition;
            this.yPosition = yPosition;
            this.zPosition = zPosition;
            this.sphere = new THREE.Mesh ( this.geometrySphere, this.materialSphere );
            this.sphere.castShadow = true; //enable shadow casting
            this.ySpeed = ySpeed;
            this.xSpeed = xSpeed;
            this.zSpeed = zSpeed;
            this.sphere.position.set(xPosition, yPosition, zPosition);
            this.wireframe.position.set(xPosition, yPosition, zPosition);
            this.topBoundary = topBoundary;
            this.bottomBoundary = bottomBoundary;
            this.gravity = 0.1;
            
            scene.add( this.sphere );//add sphere to scene
            scene.add(this.wireframe);//add wireframe to scene
        }

        move(){//Function to move sphere

            //applied gravity to the vertical speed
            this.ySpeed -= this.gravity;

            // Update positions
            this.sphere.position.x += this.xSpeed;
            this.sphere.position.y += this.ySpeed;
            this.sphere.position.z += this.zSpeed;
            this.wireframe.position.copy(this.sphere.position); // Sync wireframe position with the sphere
            
            this.sphere.rotation.z += 0.01;
            this.sphere.rotation.y += 0.01; 
            this.sphere.rotation.x += 0.01;

            this.wireframe.rotation.copy(this.sphere.rotation); // Sync wireframe rotation with the sphere
            
            // Bottom boundary check (y-axis)               //referencing half the cubes height
            if (this.sphere.position.y <= cube.position.y - cube.geometry.parameters.height / 2 - this.radius) {
                this.ySpeed *= -1; // Reverse direction                       
                this.sphere.position.y = cube.position.y - cube.geometry.parameters.height / 2 - this.radius; //Making sure balls dont leave cube
            }
            
            // Top boundary check (y-axis)
            if (this.sphere.position.y >= cube.position.y + cube.geometry.parameters.height / 2 + this.radius){
                this.ySpeed *= -1; // Reverse direction 
                this.sphere.position.y = cube.position.y + cube.geometry.parameters.height / 2 + this.radius; //Making sure balls dont leave cube
            }
           
            // Front boundary check (z-axis)
            if (this.sphere.position.z >= cube.position.z + cube.geometry.parameters.depth / 2 + this.radius) {
                this.zSpeed *= -1; // Reverse direction
                this.sphere.position.z = cube.position.z + cube.geometry.parameters.depth / 2 + this.radius; // Keep the sphere inside the cube
            }

            // Back boundary check (z-axis)
           if (this.sphere.position.z <= cube.position.z - cube.geometry.parameters.depth / 2 + this.radius) {
                this.zSpeed *= -1; // Reverse direction
                this.sphere.position.z = cube.position.z - cube.geometry.parameters.depth / 2 + this.radius; // Keep the sphere inside the cube
            }

            // Left boundary check (x-axis)
            if (this.sphere.position.x <= cube.position.x - cube.geometry.parameters.width / 2 + this.radius) {
                this.xSpeed *= -1; // Reverse direction
                this.sphere.position.x = cube.position.x - cube.geometry.parameters.width / 2 + this.radius; // Keep the sphere inside the cube
            }

            // Right boundary check (x-axis)
            if (this.sphere.position.x >= cube.position.x + cube.geometry.parameters.width / 2 - this.radius) {
                this.xSpeed *= -1; // Reverse direction
                this.sphere.position.x = cube.position.x + cube.geometry.parameters.width / 2 - this.radius; // Keep the sphere inside the cube
            }     
        }

    }
        
        // Implement scenes
        var scene = new THREE.Scene();
        
        // Create a camera with specified properties.
        var camera = new THREE.PerspectiveCamera(76, window.innerWidth / window.innerHeight, 0.1, 1000);

        // Set camera position
        camera.position.z = 150;
        camera.position.x = 40;
        camera.position.y = 20;

        // Implement renderer - Create a WebGL renderer for rendering the scene.
        var renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        //Creating a DirectionalLight and turning on shadows for the light
        const directionalLight = new THREE.DirectionalLight( 0xffffff, 1 );
        directionalLight.position.set( 10, 50, 50 ); //light shining below sphere
        directionalLight.castShadow = true; 
        
        //Setting up shadow properties for the light
        directionalLight.shadow.mapSize.width = 500; 
        directionalLight.shadow.mapSize.height = 500; 
        directionalLight.shadow.camera.near = 0.5; 
        directionalLight.shadow.camera.far = 300; 

        // Shadow camera boundaries
        directionalLight.shadow.camera.left = -100;
        directionalLight.shadow.camera.right = 100;
        directionalLight.shadow.camera.top = 100;
        directionalLight.shadow.camera.bottom = -100;
        scene.add( directionalLight );

        var helper = new THREE.CameraHelper( directionalLight.shadow.camera  );
        scene.add( helper )

        //Plane
        const geometryPlane = new THREE.PlaneGeometry( 300, 190 );
        const planeMaterial = new THREE.MeshLambertMaterial( {color: 0xfffff0, side: THREE.DoubleSide} );
        const plane = new THREE.Mesh( geometryPlane, planeMaterial );
        plane.position.y = -50; //positioning  the plane below the sphere  
        plane.rotation.x = -Math.PI / 2; // Laying the plane flat under the box
        plane.receiveShadow = true;
        scene.add( plane );//add plane to scene

        const geometry = new THREE.BoxGeometry( 70, 73, 70 ); 
        const material = new THREE.MeshLambertMaterial( {color: 0xff0000, transparent: true, opacity: 0.5 } ); 
        const cube = new THREE.Mesh( geometry, material ); 
        cube.position.set(0, 0, 0);
        scene.add( cube );

        var spotLight = new THREE.SpotLight(0xffff0);
        spotLight.position.set(100, 1000, 100);
        scene.add(spotLight);

        s1 = new Sphere(scene, -20, 0, 0, 0.5, 0.2, 0.1, 7.5, 50, -30, 0xff0000);
        s2 = new Sphere(scene, 20, -10, 0, -0.5, -0.2, 0.1, 7.5, 50, -30, 0x00ff00);

        function sphereCollision(sphere1, sphere2){//Function to check collision between spheres
        
            var dist = Math.sqrt(Math.pow(sphere1.sphere.position.x - sphere2.sphere.position.x,2) 
                 + Math.pow(sphere1.sphere.position.y - sphere2.sphere.position.y,2)
                 + Math.pow(sphere1.sphere.position.z - sphere2.sphere.position.z, 2)
            );

            if(dist < sphere1.radius + sphere2.radius){//if collision is true

                // Reversing directions on collision
                sphere1.ySpeed *= -1;
                sphere1.xSpeed *= -1;
                sphere1.zSpeed *= -1;
                sphere2.ySpeed *= -1;
                sphere2.xSpeed *= -1;
                sphere2.zSpeed *= -1;
            }
        }

        function animate(){// function to animate sphere

            s1.move();
            s2.move();
            sphereCollision(s1, s2);

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();

        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        
    </script>
</body>

</html>
