<!DOCTYPE html>
<html>
<!--Import Three.js CDN-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r127/three.min.js"></script>
<head>
    <meta charset="UTF-8">
    <title></title>
    <style type="text/css">
    </style>
</head>

<body>
    <h1>Trin</h1>
    <script type="text/javascript">

        
        // Implement scenes
        var scene = new THREE.Scene();
        
        // Create a camera with specified properties.
        var camera = new THREE.PerspectiveCamera(76, window.innerWidth / window.innerHeight, 0.1, 1000);

        // Set camera position
        camera.position.z = 40;

        // Implement renderer - Create a WebGL renderer for rendering the scene.
        var renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        //Creating a DirectionalLight and turning on shadows for the light
        const directionalLight = new THREE.DirectionalLight( 0xffffff, 1 );
        directionalLight.position.set( 10, 20, 10 ); //light shining below sphere
        directionalLight.castShadow = true; 
        
        //Setting up shadow properties for the light
        directionalLight.shadow.mapSize.width = 1024; 
        directionalLight.shadow.mapSize.height = 1024; 
        directionalLight.shadow.camera.near = 0.5; 
        directionalLight.shadow.camera.far = 500; 

        // Shadow camera boundaries
        directionalLight.shadow.camera.left = -30;
        directionalLight.shadow.camera.right = 30;
        directionalLight.shadow.camera.top = 30;
        directionalLight.shadow.camera.bottom = -30;
        scene.add( directionalLight );

        //Sphere
        const geometrySphere = new THREE.SphereGeometry( 15, 32, 16);
        const materialSphere = new THREE.MeshLambertMaterial( { color: 0xffff00, wireframe: false } );
        const sphere = new THREE.Mesh ( geometrySphere, materialSphere );
        sphere.castShadow = true; //default is false
        scene.add( sphere );//add sphere to scene

        //Plane
        const geometryPlane = new THREE.PlaneGeometry( 70, 70 );
        const planeMaterial = new THREE.MeshLambertMaterial( {color: 0xffff00, side: THREE.DoubleSide} );
        const plane = new THREE.Mesh( geometryPlane, planeMaterial );
        plane.position.y = -20; //positioning  the plane below the sphere  
        plane.rotation.x = -Math.PI / 2; // Laying the plane flat under the sphere
        plane.receiveShadow = true;
        scene.add( plane );//add plane to scene

        var spotLight = new THREE.SpotLight(0xffffff);
        spotLight.position.set(100, 1000, 100);
        scene.add(spotLight);

        //movement variables
        let speed = 0.1; 
        let direction = 1; // 1 for right, -1 for left

        function animate(){// function to rotate sphere
            sphere.rotation.z += 0.01;
            sphere.rotation.y += 0.01; 
            sphere.rotation.x += 0.01;

            sphere.position.y += speed * direction;//moving sphere left and right
            
            //change direction if it reaches a certain boundary
            if (sphere.position.y > 5 || sphere.position.y < -5) {
                direction *= -1; //reversing the direction
            }
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();

        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        
    </script>
</body>

</html>
