<!DOCTYPE html>
<html>
<!--Import Three.js CDN-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r127/three.min.js"></script>
<head>
    <meta charset="UTF-8">
    <title></title>
    <style type="text/css">
    </style>
</head>

<body>
    <h1>Trin</h1>
    <script type="text/javascript">

        
        // Implement scenes
        var scene = new THREE.Scene();
        
        // Create a camera with specified properties.
        var camera = new THREE.PerspectiveCamera(76, window.innerWidth / window.innerHeight, 0.1, 1000);

        // Set camera position
        camera.position.z = 30;

        // Implement renderer - Create a WebGL renderer for rendering the scene.
        var renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.InnerHeight);
        document.body.appendChild(renderer.domElement);

        //Sphere
        const geometrySphere = new THREE.SphereGeometry( 15, 32, 16);
        const materialSphere = new THREE.MeshLambertMaterial( { color: 0xffff00, wireframe: false } );
        const sphere = new THREE.Mesh ( geometrySphere, materialSphere );
        scene.add( sphere );//add sphere to scene

        //Plane
        const geometryPlane = new THREE.PlaneGeometry( 10, 10 );
        const planeMaterial = new THREE.MeshBasicMaterial( {color: 0xffff00, side: THREE.DoubleSide} );
        const plane = new THREE.Mesh( geometryPlane, planeMaterial );
        plane.position.y = -20; //positioning  the plane below the sphere  
        plane.rotation.x += 20; //made plane flat under sphere

        scene.add( plane );//add plane to scene

        const light = new THREE.PointLight( 0xff0000, 1, 100);
        light.position.set( 50, 50, 50);
        scene.add( light );

        var spotLight = new THREE.SpotLight(0xffffff);
        spotLight.position.set(1, 0.5, 1);
        scene.add(spotLight);


        var repeatMe = function(){// function to rotate sphere
            sphere.rotation.z += 0.01;
            sphere.rotation.y += 0.01; 
            renderer.render(scene, camera);
            requestAnimationFrame(repeatMe);
        }
        repeatMe();

        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        
    </script>
</body>

</html>
