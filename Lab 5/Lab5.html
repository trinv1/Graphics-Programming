<!DOCTYPE html>
<html>
<!--Import Three.js CDN-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r127/three.min.js"></script>
<head>
    <meta charset="UTF-8">
    <title></title>
    <style type="text/css">
    </style>
</head>

<body>
    <h1>Trin</h1>
    <script type="text/javascript">

class Sphere {//Class for sphere
        
        constructor(scene, xPosition, yPosition, zPosition, ySpeed, xSpeed, zSpeed, radius, topBoundary, bottomBoundary, colour){//Constructor with parameters
            this.radius = radius;
            this.geometrySphere = new THREE.SphereGeometry( this.radius, 32, 16);
            this.materialSphere = new THREE.MeshLambertMaterial( { color: colour, wireframe: false } );
            this.xPosition = xPosition;
            this.yPosition = yPosition;
            this.zPosition = zPosition;
            this.sphere = new THREE.Mesh ( this.geometrySphere, this.materialSphere );
            this.sphere.castShadow = true; //enable shadow casting
            this.ySpeed = ySpeed;
            this.xSpeed = xSpeed;
            this.zSpeed = zSpeed;
            this.sphere.position.set(xPosition, yPosition, zPosition);
            this.topBoundary = topBoundary;
            this.bottomBoundary = bottomBoundary;
            
            scene.add( this.sphere );//add sphere to scene
        }

        move(){//Function to move sphere

            // Update positions
            this.sphere.position.x += this.xSpeed;
            this.sphere.position.y += this.ySpeed;
            this.sphere.position.z += this.zSpeed;
            
            this.sphere.rotation.z += 0.01;
            this.sphere.rotation.y += 0.01; 
            this.sphere.rotation.x += 0.01;
            
             // Boundary checks for vertical movement
        if (this.sphere.position.y >= this.topBoundary - this.radius 
        || this.sphere.position.y <= plane.position.y + this.radius) {
            this.ySpeed *= -1; // Reverse direction 
        }
            
        }

    }
        
        // Implement scenes
        var scene = new THREE.Scene();
        
        // Create a camera with specified properties.
        var camera = new THREE.PerspectiveCamera(76, window.innerWidth / window.innerHeight, 0.1, 1000);

        // Set camera position
        camera.position.z = 80;

        // Implement renderer - Create a WebGL renderer for rendering the scene.
        var renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        //Creating a DirectionalLight and turning on shadows for the light
        const directionalLight = new THREE.DirectionalLight( 0xffffff, 1 );
        directionalLight.position.set( 10, 20, 10 ); //light shining below sphere
        directionalLight.castShadow = true; 
        
        //Setting up shadow properties for the light
        directionalLight.shadow.mapSize.width = 1024; 
        directionalLight.shadow.mapSize.height = 1024; 
        directionalLight.shadow.camera.near = 0.5; 
        directionalLight.shadow.camera.far = 500; 

        // Shadow camera boundaries
        directionalLight.shadow.camera.left = -30;
        directionalLight.shadow.camera.right = 30;
        directionalLight.shadow.camera.top = 30;
        directionalLight.shadow.camera.bottom = -30;
        scene.add( directionalLight );

        //Plane
        const geometryPlane = new THREE.PlaneGeometry( 70, 60 );
        const planeMaterial = new THREE.MeshLambertMaterial( {color: 0xffff00, side: THREE.DoubleSide} );
        const plane = new THREE.Mesh( geometryPlane, planeMaterial );
        plane.position.y = -30; //positioning  the plane below the sphere  
        plane.rotation.x = -Math.PI / 2; // Laying the plane flat under the sphere
        plane.receiveShadow = true;
        scene.add( plane );//add plane to scene

        const light = new THREE.AmbientLight( 0x404040, 0.3 ); // soft white light
        light.position.set(50, 50, 100);
        scene.add( light );   
     
        var spotLight = new THREE.SpotLight(0xffff0);
        spotLight.position.set(100, 1000, 100);
        scene.add(spotLight);

        s1 = new Sphere(scene, -20, 0, 0, 0.5, 0.2, 0.1, 15, 50, -30, 0xff0000);
        s2 = new Sphere(scene, 20, -10, 0, -0.5, -0.2, 0.1, 15, 50, -30, 0x00ff00);

        function sphereCollision(sphere1, sphere2){//Function to check collision between spheres
        
            var dist = Math.sqrt(Math.pow(sphere1.sphere.position.x - sphere2.sphere.position.x,2) 
                 + Math.pow(sphere1.sphere.position.y - sphere2.sphere.position.y,2)
                 + Math.pow(sphere1.sphere.position.z - sphere2.sphere.position.z, 2)
            );

            if(dist < sphere1.radius + sphere2.radius){//if collision is true

                // Reversing directions on collision
                sphere1.ySpeed *= -1;
                sphere1.xSpeed *= -1;
                sphere1.zSpeed *= -1;
                sphere2.ySpeed *= -1;
                sphere2.xSpeed *= -1;
                sphere2.zSpeed *= -1;
            }
        }

        function animate(){// function to animate sphere

            s1.move();
            s2.move();
            sphereCollision(s1, s2);
            
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();

        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        
    </script>
</body>

</html>
